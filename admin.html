<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin | Previous Paper Mela</title>

    <link
        rel="icon"
        href="assets/icons/logo.svg"
        type="image/svg+xml"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="admin-page">


    <header class="site-header">

        <div class="header-inner">

            <a
                href="dashboard.html"
                class="brand"
            >

                <img
                    src="assets/icons/logo.svg"
                    class="brand-logo"
                    alt=""
                >

                <div class="brand-copy">

                    <div class="brand-title">
                        Previous Paper Mela
                    </div>

                    <div class="brand-subtitle">
                        Admin Panel
                    </div>

                </div>

            </a>

        </div>

    </header>


    <main>

        <section class="admin-section">

            <div class="section-container">

                <div class="admin-card">

                    <div class="section-kicker">
                        ADMIN AREA
                    </div>

                    <h1>
                        Paper Management
                    </h1>

                    <p>
                        This area is reserved for the website
                        administrator.
                    </p>


                    <div class="admin-notice">

                        <strong>
                            Coming next:
                        </strong>

                        <p>
                            A secure admin system will allow you to
                            add question papers, select semester,
                            subject and year, and publish them to
                            the website.
                        </p>

                    </div>


                    <a
                        href="dashboard.html"
                        class="about-button"
                    >
                        Back to Dashboard →
                    </a>

                </div>

            </div>

        </section>

    </main>


    <script src="js/admin.js"></script>

</body>

</html>
